<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Forecast</title>
    
    <!-- Local Core Chart.js File -->
    <script src="/js/chart.umd.js"></script>
    <!-- Local Data Labels Extension Plugin -->
    <script src="/plugin/chartjs-plugin-datalabels.js"></script>
    
    <!-- Pull in the clean, elegant Lora Serif Google Font family directly for our Option 2 pairing -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        .card { 
            background: #202024; 
            padding: 24px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .text-left {
            text-align: left;
            padding-left: 5px;
        }
        /* Option 2: Sans-Serif Font Family for Main App Title */
        h1 { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 32px; 
            font-weight: 400;
            margin-bottom: 6px; 
            letter-spacing: -0.5px;
        }
        /* Option 2: Elegant Serif Font Family for the Status Subtitle */
        .status-tracker {
            font-family: 'Lora', serif;
            font-style: italic;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 15px;
            letter-spacing: 0.2px;
        }
        .weekly-avg-footer {
            font-family: 'Lora', serif;
            font-size: 18px;
            font-style: italic;
            font-weight: 500;
            text-align: left;
            margin-top: 15px;
            padding-left: 5px;
            display: none; 
        }
        button { 
            background: #00b0ff; 
            border: none; 
            color: #fff; 
            padding: 12px 24px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            width: 100%; 
            transition: background 0.2s ease;
        }
        button:hover { 
            background: #0091ea; 
        }
        .chart-container { 
            position: relative; 
            margin-top: 25px; 
            height: 350px; 
            width: 100%; 
        }
        @media(min-width: 480px) {
            button { width: auto; display: block; margin: 0 auto; } 
            body { padding: 40px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Option 2 Clean Typography Font Alignment Structure -->
        <div class="text-left">
            <h1>Live Weather Forecast</h1>
            <div id="status-display" class="status-tracker" style="color: #a8a8b3;">Status: Awaiting Data Compilation</div>
        </div>
        
        <div class="card">
            <button onclick="fetchForecast()">Load Weekly Forecast</button>
            
            <div class="chart-container">
                <canvas id="weatherChart"></canvas>
            </div>
        </div>

        <div id="avg-display" class="weekly-avg-footer"></div>
    </div>

    <script>
        let myChart = null;

        const monthMap = {
            "01": "Jan", "02": "Feb", "03": "Mar", "04": "Apr", "05": "May", "06": "Jun",
            "07": "Jul", "08": "Aug", "09": "Sep", "10": "Oct", "11": "Nov", "12": "Dec"
        };

        // Formats "2026-10-10" directly to "Oct-10" safely
        function formatAxisLabel(dateStr) {
            try {
                const parts = dateStr.split('-');
                return `${monthMap[parts[1]] || "Oct"}-${parts[2]}`;
            } catch(e) {
                return dateStr;
            }
        }

        async function fetchForecast() {
            const btn = document.querySelector('button');
            const avgDisplay = document.getElementById('avg-display');
            const statusDisplay = document.getElementById('status-display');
            try {
                btn.innerText = "Loading...";
                
                const response = await fetch('/api/weather?t=' + Date.now());
                if (!response.ok) throw new Error("Server communication sync error.");
                
                const data = await response.json();

                // Dynamic Status String Handler
                if (data.status === "error" || data.fallback_active || !navigator.onLine) {
                    statusDisplay.innerText = "Status: Offline Backup Active";
                    statusDisplay.style.color = "#ffb74d"; 
                } else {
                    statusDisplay.innerText = "Status: Online Live Satellite Data";
                    statusDisplay.style.color = "#4fc3f7"; 
                }

                if (data.average) {
                    const avgVal = data.average;
                    avgDisplay.innerText = `Weekly Average: ${Math.round(avgVal)}°F`;
                    avgDisplay.style.display = "block"; 

                    if (avgVal > 100) {
                        avgDisplay.style.color = "#ff5252"; 
                    } else if (avgVal >= 80 && avgVal <= 100) {
                        avgDisplay.style.color = "#4caf50"; 
                    } else {
                        avgDisplay.style.color = "#00b0ff"; 
                    }
                }

                const cleanAxisLabels = data.dates.map(d => formatAxisLabel(d));
                const ctx = document.getElementById('weatherChart').getContext('2d');
                if (myChart) { myChart.destroy(); }

                myChart = new Chart(ctx, {
                    type: 'line',
                    plugins: [ChartDataLabels],
                    data: {
                        labels: cleanAxisLabels,
                        datasets: [{
                            label: 'Max Temp. (°F) Meza, AZ',
                            data: data.max_temps,
                            borderColor: '#00b0ff',
                            backgroundColor: 'rgba(0, 176, 255, 0.04)',
                            borderWidth: 3,
                            tension: 0.2,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            // FIXED: Increased layout top padding from 70 to 105 to push the entire grid line frame down away from the title
                            padding: { top: 105, left: 15, right: 15 }
                        },
                        scales: {
                            y: { grid: { color: '#29292e' }, ticks: { color: '#a8a8b3' } },
                            x: { grid: { color: '#29292e' }, ticks: { color: '#a8a8b3' } }
                        },
                        plugins: { 
                            legend: { 
                                display: true,
                                position: 'top',
                                align: 'center',
                                labels: { 
                                    color: '#ffffff',
                                    boxWidth: 0,
                                    // FIXED: Set title margin padding to 15px down from the ceiling boundary
                                    padding: 15, 
                                    font: { size: 14, weight: 'bold' }
                                }
                            },
                            tooltip: { enabled: true },
                            datalabels: {
                                color: '#4fc3f7',
                                align: 'top', 
                                offset: 15, // Pushes text labels safely over data points
                                display: true,
                                font: { weight: 'bold', size: 11 },
                                formatter: function(value, context) {
                                    const index = context.dataIndex;
                                    const rawTemp = Math.round(value);
                                    const timeStr = data.spike_times && data.spike_times[index] ? data.spike_times[index] : '3:00 pm';
                                    return `${rawTemp}° ${timeStr}`;
                                }
                            }
                        }
                    }
                });

                btn.innerText = "Load Weekly Forecast";

            } catch (err) {
                console.error(err);
                btn.innerText = "❌ Load Error";
                statusDisplay.innerText = "Status: Connection Disrupted";
                statusDisplay.style.color = "#ff5252";
            }
        }
    </script>
</body>
</html>
